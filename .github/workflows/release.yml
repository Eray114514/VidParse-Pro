name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "VidParse Pro ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Inject Version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          jq '.version = "'$VERSION'"' src-tauri/tauri.conf.json > temp.json && mv temp.json src-tauri/tauri.conf.json

      - name: Download yt-dlp and ffmpeg (Windows)
        shell: pwsh
        run: |
          mkdir -p src-tauri/binaries
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          Move-Item ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/binaries/ffmpeg.exe
          Remove-Item ffmpeg.zip
          Remove-Item -Recurse -Force ffmpeg-master-latest-win64-gpl

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VidParse Pro ${{ github.ref_name }}"
          releaseBody: "Release of VidParse Pro."
          releaseDraft: false
          prerelease: false

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Inject Version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          jq '.version = "'$VERSION'"' src-tauri/tauri.conf.json > temp.json && mv temp.json src-tauri/tauri.conf.json

      - name: Build Native Android App
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APK_PATH=$(find android-app/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
            
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" "VidParse-Pro-${VERSION}-aligned.apk"
            
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "VidParse-Pro-${VERSION}-signed.apk" \
              "VidParse-Pro-${VERSION}-aligned.apk"
              
            echo "SIGNED_APK=VidParse-Pro-${VERSION}-signed.apk" >> $GITHUB_ENV
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload Android Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.SIGNED_APK }}
          draft: true
          prerelease: false

      - name: Build Tauri Windows/macOS/Linux App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "VidParse Pro v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
